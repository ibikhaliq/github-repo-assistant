services:

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      OLLAMA_BASE_URL: http://ollama:11434/v1
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./repositories:/app/repositories
    depends_on:
      redis:
        condition: service_started
      ollama:
        condition: service_healthy

  worker:
    build: .
    command: rq worker indexing
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://ollama:11434/v1
    volumes:
      - ./repositories:/app/repositories
    depends_on:
      redis:
        condition: service_started
      ollama:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  ollama_data: